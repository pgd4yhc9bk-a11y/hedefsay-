name: Godot web çıktısı

on:
  push:
    branches: [main, "claude/**"]
    paths: ["oyun-fikirlerim/iki-kisilik-oyun/godot/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Şablonları yerleştir
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable 2>/dev/null || true
      - name: İçe aktar ve dışa aktar
        working-directory: oyun-fikirlerim/iki-kisilik-oyun/godot
        run: |
          mkdir -p build/web
          godot --headless --import || true
          godot --headless --export-release "Web" build/web/index.html
      - name: Android APK (gelişmiş görüntü motoru)
        id: apk
        continue-on-error: true
        working-directory: oyun-fikirlerim/iki-kisilik-oyun/godot
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          ls "$SDK" || true
          KS=/root/debug.keystore
          if [ ! -f "$KS" ]; then
            KS="$PWD/debug.keystore"
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KS" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK" "$KS" > ~/.config/godot/$f
          done
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$KS" GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/sis.apk
          ls -la build/android
          cp build/android/sis.apk build/web/sis.apk
      - name: APK'yı sakla
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sis-android-apk
          path: oyun-fikirlerim/iki-kisilik-oyun/godot/build/android/sis.apk
          retention-days: 30
      - name: Web sürümünü indirilebilir paket olarak sakla (itch.io için)
        uses: actions/upload-artifact@v4
        with:
          name: sis-web
          path: oyun-fikirlerim/iki-kisilik-oyun/godot/build/web
          retention-days: 30
      - name: gh-pages dalına yayınla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: oyun-fikirlerim/iki-kisilik-oyun/godot/build/web
          force_orphan: true
