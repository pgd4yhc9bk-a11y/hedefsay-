<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>İki Kişilik Oyun Prototipi</title>
<style>
  :root { color-scheme: dark; --bg:#14171d; --mint:#6fd6b5; --coral:#ff7a6b; --text:#eef0f4; --mute:#8b92a1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #root { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; background:#000; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud { position:absolute; top:8px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center;
    font-weight:600; text-shadow:0 1px 3px #0008; pointer-events:none; }
  .hud button { pointer-events:auto; background:#0006; border:1px solid #fff4; color:#fff; border-radius:10px; padding:6px 12px; font:inherit; }
  .pad { position:absolute; bottom:10px; display:flex; gap:8px; }
  .pad.a { left:12px; } .pad.b { right:12px; }
  .pad button { width:clamp(44px,9vw,72px); height:clamp(44px,9vw,72px); border-radius:50%; border:2px solid #fff6;
    font-size:clamp(18px,4vw,28px); color:#fff; opacity:.8; }
  .pad.a button { background:#2f8f74aa; } .pad.b button { background:#c9503fcc; }
  .pad button.down { opacity:1; transform:scale(.94); }
  @media (pointer:fine) { .pad { display:none; } }
  #help { position:absolute; bottom:8px; left:0; right:0; text-align:center; color:#fffa; font-size:12px; text-shadow:0 1px 2px #000; pointer-events:none; }
  @media (pointer:coarse) { #help { display:none; } }
  #win, #rot { position:fixed; inset:0; background:#000c; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; z-index:5; padding:16px; }
  #win[hidden], #rot[hidden] { display:none; }
  #win h2 { margin:0; font-size:28px; }
  #win button { background:var(--mint); color:#10231d; font:inherit; font-weight:700; border:0; border-radius:12px; padding:12px 26px; }
</style>
</head>
<body>
<div id="root">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><span id="hudL"></span><button id="restart">↻ Baştan</button></div>
    <div class="pad a" data-ch="a"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">⤒</button></div>
    <div class="pad b" data-ch="b"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">⤒</button></div>
    <div id="help"><b style="color:#6fd6b5">Yeşil:</b> A D W &nbsp;·&nbsp; <b style="color:#ff8a7a">Turuncu:</b> ← → ↑ &nbsp;·&nbsp; R: baştan</div>
  </div>
</div>
<div id="win" hidden><h2>Bölüm tamam!</h2><div id="winInfo"></div><button id="again">Tekrar oyna</button></div>
<div id="rot" hidden><div style="font-size:40px">📱↻</div><div>Telefonu yatay çevirin</div></div>

<script>
"use strict";
const SPRITES = {
  a: { idle:'sprites/a_idle.png', run1:'sprites/a_run1.png', run2:'sprites/a_run2.png', jump:'sprites/a_jump.png' },
  b: { idle:'sprites/b_idle.png', run1:'sprites/b_run1.png', run2:'sprites/b_run2.png', jump:'sprites/b_jump.png' },
};
const img = {};
for (const c in SPRITES) { img[c] = {}; for (const k in SPRITES[c]) { const i = new Image(); i.src = SPRITES[c][k]; img[c][k] = i; } }

const W = 1280, H = 720, G = 2000, ROPE = 300, DT = 1 / 120;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
cv.width = W * 2; cv.height = H * 2;

/* ---------- Bölüm ---------- */
const statics = [{ x: 0, y: 640, w: 1280, h: 80 }, { x: 840, y: 470, w: 210, h: 28 }];
const plate = { x: 380, y: 626, w: 110, h: 14 };       // ağır düğme: B veya kutu
const gate = { x: 640, y: 340, w: 28, h: 300, open: 0 };
const door = { x: 1130, y: 540, w: 100, h: 100 };
const star = { x: 930, y: 420, w: 36, h: 36, got: false };
const START = { a: { x: 70, y: 640 - 58 }, b: { x: 150, y: 640 - 86 }, crate: { x: 230, y: 570 } };

const mk = (name, w, h, speed, jump, mass) => ({ name, w, h, speed, jump, mass, x: 0, y: 0, vx: 0, vy: 0, dx: 0, face: 1,
  onGround: false, standing: null, coyote: 0, anim: 0, squash: 0, left: false, right: false, jumpHeld: false, jumpReq: 0 });
const A = mk("a", 44, 58, 300, 800, 1), B = mk("b", 72, 86, 230, 600, 2);
const crate = { x: 0, y: 0, w: 70, h: 70, vy: 0, dx: 0 };
let won = false, time = 0, stars = 0;

function reset() {
  Object.assign(A, START.a, { vx: 0, vy: 0, face: 1 }); Object.assign(B, START.b, { vx: 0, vy: 0, face: 1 });
  Object.assign(crate, START.crate, { vy: 0 }); gate.open = 0; star.got = false; stars = 0; won = false; time = 0;
  document.getElementById("win").hidden = true;
}
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const gateRect = () => ({ x: gate.x, y: gate.y, w: gate.w, h: gate.h * (1 - gate.open) });
const gateBlocks = () => gate.open < 0.6;   // yarıdan fazla kalkınca geçilebilir
function solidsFor(e) {
  const s = statics.slice(); if (gateBlocks()) s.push(gateRect());
  if (e === A) s.push(crate);   // A kutuyu itemez, katı engel
  return s;
}
const other = (e) => (e === A ? B : A);

/* ---------- Fizik ---------- */
function crateMoveX(d) {
  const old = crate.x; crate.x += d;
  const s = statics.slice(); if (gateBlocks()) s.push(gateRect());
  for (const r of s) if (ov(crate, r)) crate.x = d > 0 ? r.x - crate.w : r.x + r.w;
  crate.dx += crate.x - old;
}
function moveX(e, dx) {
  if (!dx) return;
  const before = e.x; e.x += dx;
  for (const s of solidsFor(e)) if (ov(e, s)) e.x = dx > 0 ? s.x - e.w : s.x + s.w;
  if (e === B && ov(e, crate)) {                                  // B kutuyu iter
    crateMoveX(dx > 0 ? e.x + e.w - crate.x : e.x - (crate.x + crate.w));
    if (ov(e, crate)) e.x = dx > 0 ? crate.x - e.w : crate.x + crate.w;
  }
  e.dx += e.x - before;
}
function moveY(e, dy) {
  const prevBottom = e.y + e.h; e.y += dy;
  const solids = solidsFor(e); if (e === B) solids.push(crate);
  for (const s of solids) if (ov(e, s)) {
    if (dy > 0) { e.y = s.y - e.h; land(e, s === crate ? crate : null); }
    else if (dy < 0) { e.y = s.y + s.h; e.vy = 0; }
  }
  const o = other(e);
  if (dy > 0 && ov(e, o) && prevBottom <= o.y + 6) { e.y = o.y - e.h; land(e, o); }
}
function land(e, on) {
  if (e.vy > 350) e.squash = 0.14;
  e.vy = 0; e.onGround = true; e.standing = on;
}
function stepCrate(dt) {
  crate.vy += G * dt; const oy = crate.y; crate.y += crate.vy * dt;
  const s = statics;
  for (const r of s) if (ov(crate, r)) { if (crate.vy > 0) crate.y = r.y - crate.h; else crate.y = r.y + r.h; crate.vy = 0; }
}
function control(e, k, dt, grounded) {
  const dir = (k.right ? 1 : 0) - (k.left ? 1 : 0);
  const target = dir * e.speed, acc = (grounded ? 2600 : 1500) * dt;
  e.vx += Math.max(-acc, Math.min(acc, target - e.vx));
  if (dir) e.face = dir;
  e.coyote = grounded ? 0.1 : e.coyote - dt;
  if (e.jumpReq > 0) e.jumpReq -= dt;
  if (e.jumpReq > 0 && e.coyote > 0) { e.vy = -e.jump; e.coyote = 0; e.jumpReq = 0; e.onGround = false; }
  if (!k.jump && e.vy < -250) e.vy *= 0.6;           // erken bırakınca kısa zıplama
}
function stepChar(e, k, dt) {
  const grounded = e.onGround;   // önceki adımdaki zemin durumu
  e.dx = 0; e.onGround = false; e.standing = null;
  const o = other(e);
  if (e.standLast && e.standLast === o) moveX(e, o.dx);          // üstünde durduğu karakterle taşın
  if (e.standLast && e.standLast === crate) moveX(e, crate.dx);
  control(e, k, dt, grounded);
  // ip: uzayınca iki karakteri birbirine çeker (hafif olan daha çok çekilir)
  const cx = (x) => x.x + x.w / 2, cy = (x) => x.y + x.h / 2;
  const vx = cx(o) - cx(e), vy = cy(o) - cy(e), d = Math.hypot(vx, vy);
  if (d > ROPE) { const f = Math.min((d - ROPE) * 14, 2200) * dt / e.mass; e.vx += vx / d * f; e.vy += vy / d * f * 0.5; }
  e.vy += G * dt;
  moveX(e, e.vx * dt);
  moveY(e, e.vy * dt);
  if (e.squash > 0) e.squash -= dt;
  e.standLast = e.standing;
  if (Math.abs(e.vx) > 20 && e.onGround) e.anim += dt * 9;
  if (e.y > H + 150) { Object.assign(e, START[e.name], { vx: 0, vy: 0 }); }
}

/* ---------- Girdi ---------- */
const keys = { a: {}, b: {} }, touch = { a: {}, b: {} };
const map = { KeyA: ["a", "left"], KeyD: ["a", "right"], KeyW: ["a", "jump"], ArrowLeft: ["b", "left"], ArrowRight: ["b", "right"], ArrowUp: ["b", "jump"] };
const ent = { a: A, b: B };
function press(ch, k, v) { const t = keys[ch], e = ent[ch]; if (k === "jump" && v && !t.jump) e.jumpReq = 0.12; t[k] = v; }
addEventListener("keydown", (ev) => {
  if (ev.code === "KeyR") reset();
  const m = map[ev.code]; if (m) { press(m[0], m[1], true); ev.preventDefault(); }
});
addEventListener("keyup", (ev) => { const m = map[ev.code]; if (m) press(m[0], m[1], false); });
for (const btn of document.querySelectorAll(".pad button")) {
  const ch = btn.parentElement.dataset.ch, k = btn.dataset.k;
  const on = (ev) => { ev.preventDefault(); btn.setPointerCapture(ev.pointerId); btn.classList.add("down"); tp(ch, k, true); };
  const off = (ev) => { btn.classList.remove("down"); tp(ch, k, false); };
  btn.addEventListener("pointerdown", on); ["pointerup", "pointercancel", "lostpointercapture"].forEach((n) => btn.addEventListener(n, off));
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}
function tp(ch, k, v) { const t = touch[ch], e = ent[ch]; if (k === "jump" && v && !t.jump) e.jumpReq = 0.12; t[k] = v; }
const input = (ch) => ({ left: keys[ch].left || touch[ch].left, right: keys[ch].right || touch[ch].right, jump: keys[ch].jump || touch[ch].jump });
document.getElementById("restart").onclick = reset;
document.getElementById("again").onclick = reset;

/* ---------- Güncelle ---------- */
let acc = 0, last = performance.now();
function update(dt) {
  A.dx = B.dx = crate.dx = 0;
  const pressed = ov({ x: B.x, y: B.y + B.h - 6, w: B.w, h: 8 }, plate) || ov({ x: crate.x, y: crate.y + crate.h - 6, w: crate.w, h: 8 }, plate);
  // kapı, altında biri varken kapanmaz
  const zone = { x: gate.x - 4, y: gate.y, w: gate.w + 8, h: gate.h };
  const hold = pressed || ov(A, zone) || ov(B, zone) || ov(crate, zone);
  gate.open += ((hold ? 1 : 0) - gate.open) * Math.min(1, dt * 6); if (hold && gate.open > 0.98) gate.open = 1;
  plate.pressed = pressed;
  stepCrate(dt);
  stepChar(B, input("b"), dt);
  stepChar(A, input("a"), dt);
  if (!star.got) for (const e of [A, B]) if (ov(e, star)) { star.got = true; stars++; }
  const inDoor = (e) => e.x + e.w / 2 > door.x && e.x + e.w / 2 < door.x + door.w && e.y + e.h > door.y;
  if (!won && inDoor(A) && inDoor(B)) {
    won = true; document.getElementById("winInfo").textContent = `Süre: ${time.toFixed(1)} sn · Yıldız: ${stars}/1`;
    document.getElementById("win").hidden = false;
  }
  if (!won) time += dt;
}

/* ---------- Çizim (geçici dünya görselleri) ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawWorld() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#9edcf0"); g.addColorStop(1, "#e6f6e9");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#cfeedd"; ctx.beginPath(); ctx.ellipse(250, 650, 420, 190, 0, Math.PI, 0); ctx.ellipse(900, 650, 520, 250, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#ffffffcc"; for (const [x, y] of [[180, 110], [620, 70], [1000, 140]]) { ctx.beginPath(); ctx.ellipse(x, y, 70, 24, 0, 0, 7); ctx.ellipse(x + 40, y - 10, 50, 22, 0, 0, 7); ctx.fill(); }
  for (const s of statics) { ctx.fillStyle = "#9b6b43"; rr(s.x, s.y, s.w, s.h, 6); ctx.fill(); ctx.fillStyle = "#6bbf59"; rr(s.x, s.y, s.w, 14, 6); ctx.fill(); }
  // düğme
  ctx.fillStyle = "#5b4636"; rr(plate.x - 6, 632, plate.w + 12, 10, 4); ctx.fill();
  ctx.fillStyle = plate.pressed ? "#7dd66f" : "#ff9b3d"; rr(plate.x, plate.pressed ? 634 : 626, plate.w, plate.pressed ? 6 : 14, 5); ctx.fill();
  // kapı (kapı kolu yukarı çekilir)
  if (gateBlocks()) { const r = gateRect(); ctx.fillStyle = "#7a5b9a"; rr(r.x, r.y, r.w, r.h, 6); ctx.fill(); ctx.fillStyle = "#ffffff30"; ctx.fillRect(r.x + 6, r.y + 6, 4, Math.max(0, r.h - 12)); }
  // bitiş kapısı
  ctx.fillStyle = won ? "#ffd75e" : "#5a7fcf"; rr(door.x, door.y, door.w, door.h, 14); ctx.fill();
  ctx.fillStyle = "#0004"; rr(door.x + 14, door.y + 14, door.w - 28, door.h - 14, 10); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "600 14px system-ui"; ctx.textAlign = "center"; ctx.fillText("İKİSİ DE", door.x + door.w / 2, door.y - 8); ctx.textAlign = "left";
  // kutu
  ctx.fillStyle = "#c58a4a"; rr(crate.x, crate.y, crate.w, crate.h, 6); ctx.fill(); ctx.strokeStyle = "#7a4f24"; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(crate.x + 8, crate.y + 8); ctx.lineTo(crate.x + crate.w - 8, crate.y + crate.h - 8); ctx.moveTo(crate.x + crate.w - 8, crate.y + 8); ctx.lineTo(crate.x + 8, crate.y + crate.h - 8); ctx.stroke();
  // yıldız
  if (!star.got) { const b = Math.sin(time * 4) * 4; ctx.fillStyle = "#ffc857"; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 8 : 19; ctx.lineTo(star.x + 18 + Math.cos(a) * r, star.y + 18 + b + Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.strokeStyle = "#8a5a12"; ctx.lineWidth = 3; ctx.stroke(); }
}
function drawRope() {
  const ax = A.x + A.w / 2, ay = A.y + A.h * 0.55, bx = B.x + B.w / 2, by = B.y + B.h * 0.55;
  const d = Math.hypot(bx - ax, by - ay), slack = Math.max(0, ROPE - d);
  ctx.strokeStyle = "#f4e6b8"; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 + slack * 0.45, bx, by); ctx.stroke();
  ctx.strokeStyle = "#a58a52"; ctx.lineWidth = 2; ctx.setLineDash([6, 8]); ctx.stroke(); ctx.setLineDash([]);
}
function frameOf(e) {
  if (!e.onGround) return "jump";
  if (Math.abs(e.vx) > 20) return Math.floor(e.anim) % 2 ? "run2" : "run1";
  return "idle";
}
function drawChar(e) {
  const im = img[e.name][frameOf(e)]; if (!im.complete || !im.naturalWidth) { ctx.fillStyle = e.name === "a" ? "#6fd6b5" : "#ff7a6b"; ctx.fillRect(e.x, e.y, e.w, e.h); return; }
  const w = im.naturalWidth / 2, h = im.naturalHeight / 2;
  const sq = e.squash > 0 ? 1 - e.squash * 1.2 : 1, bob = frameOf(e) === "idle" ? 1 + Math.sin(time * 3 + (e.name === "b" ? 1 : 0)) * 0.012 : 1;
  ctx.save(); ctx.translate(e.x + e.w / 2, e.y + e.h + 2);
  ctx.scale(e.face * (1 + (1 - sq) * 0.8), sq * bob);
  ctx.drawImage(im, -w / 2, -h, w, h); ctx.restore();
}
function draw() {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  drawWorld(); drawRope(); drawChar(B); drawChar(A);
  document.getElementById("hudL").textContent = `⭐ ${stars}/1   ⏱ ${time.toFixed(0)} sn`;
}
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= DT) { update(DT); acc -= DT; }
  draw(); requestAnimationFrame(frame);
}
function checkRot() { document.getElementById("rot").hidden = !(matchMedia("(pointer:coarse)").matches && innerHeight > innerWidth); }
addEventListener("resize", checkRot); checkRot();
reset(); requestAnimationFrame(frame);
window.__g = { A, B, crate, gate, press, reset, update, get won() { return won; } };
</script>
</body>
</html>
