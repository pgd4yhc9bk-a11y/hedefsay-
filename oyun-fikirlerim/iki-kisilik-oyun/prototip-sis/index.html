<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sis</title>
<style>
  :root { color-scheme: dark; --bg:#0b0b0c; --text:#d9dadd; --mute:#8e9094; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #root { height:100%; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; background:#000; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .pad { position:absolute; bottom:max(10px, env(safe-area-inset-bottom,0px)); display:flex; gap:10px; }
  .pad.l { left:max(14px, env(safe-area-inset-left,0px)); } .pad.r { right:max(14px, env(safe-area-inset-right,0px)); }
  .pad button { width:clamp(52px,10vw,82px); height:clamp(52px,10vw,82px); border-radius:50%; border:2px solid #ffffff40;
    background:#0008; color:#fff; font-size:clamp(20px,4vw,30px); opacity:.65; }
  .pad button.down { opacity:1; background:#fff3; transform:scale(.94); }
  @media (pointer:fine) { .pad { display:none; } }
  #menu { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at center, #0000 0%, #000c 100%); text-align:center; }
  #menu[hidden], #rot[hidden], #end[hidden] { display:none; }
  #menu h1 { margin:0; font-size:clamp(40px,9vw,88px); letter-spacing:.5em; padding-left:.5em; font-weight:200; color:#e9eaec; text-shadow:0 0 30px #fff5; }
  #menu .sub { color:var(--mute); letter-spacing:.2em; font-size:12px; text-transform:uppercase; }
  .lv { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .lv button, #menu .go { background:none; border:1px solid #ffffff50; color:#e9eaec; padding:10px 22px; font:inherit; letter-spacing:.2em; text-transform:uppercase; border-radius:2px; }
  .lv button:hover, #menu .go:hover { background:#ffffff18; }
  #help { color:var(--mute); font-size:12px; letter-spacing:.05em; }
  @media (pointer:coarse) { #help { display:none; } }
  #rot { position:fixed; inset:0; background:#000e; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  #end { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#000d; text-align:center; letter-spacing:.1em; }
  #end button { background:none; border:1px solid #ffffff50; color:#e9eaec; padding:10px 22px; font:inherit; letter-spacing:.2em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="root"><div id="stage">
  <canvas id="cv"></canvas>
  <div class="pad l"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="pad r"><button data-k="grab">✋</button><button data-k="jump">⤒</button></div>
  <div id="menu">
    <div class="sub">Çalışma adı</div><h1>SİS</h1>
    <div class="lv" id="lv"></div>
    <div id="help">← → / A D yürü · ↑ / W / Boşluk zıpla · Shift / E tut ve çek · R yeniden</div>
  </div>
  <div id="end" hidden><div style="font-size:22px">Bölümler bitti</div><div style="color:#8e9094">Sıradaki: ikinci oyuncu ve sesli co-op</div><button id="toMenu">Menü</button></div>
</div></div>
<div id="rot" hidden><div style="font-size:40px">📱↻</div><div>Telefonu yatay çevirin</div></div>

<script>
"use strict";
const W = 1280, H = 720, G = 1900, DT = 1 / 120;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const SC = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * SC; cv.height = H * SC;

/* ============ Bölümler (veri) ============ */
const GY = 560;
const LEVELS = [
  { name: "Sis", w: 2700, start: { x: 60, y: GY - 54 },
    statics: [{ x: 0, y: GY, w: 800, h: 160 }, { x: 920, y: GY, w: 580, h: 160 }, { x: 1100, y: 470, w: 60, h: 90 },
              { x: 1500, y: 410, w: 400, h: 310 }, { x: 1900, y: GY, w: 800, h: 160 }],
    crates: [{ x: 1250, y: GY - 56 }], plates: [], doors: [],
    spikes: [{ x: 2000, y: GY - 24, w: 100, h: 24 }], saws: [], checkpoints: [930, 1950],
    exit: { x: 2550, y: GY - 100, w: 70, h: 100 } },
  { name: "Ağırlık", w: 2500, start: { x: 60, y: GY - 54 },
    statics: [{ x: 0, y: GY, w: 1500, h: 160 }, { x: 1610, y: GY, w: 300, h: 160 }, { x: 1910, y: 400, w: 590, h: 320 }],
    crates: [{ x: 300, y: GY - 56 }, { x: 1700, y: GY - 56 }],
    plates: [{ x: 700, y: GY - 8, w: 90, h: 8, door: 0 }], doors: [{ x: 1000, y: 300, w: 30, h: 260 }],
    spikes: [], saws: [], checkpoints: [1060, 1650],
    exit: { x: 2300, y: 300, w: 70, h: 100 } },
  { name: "Testere", w: 2800, start: { x: 60, y: GY - 54 },
    statics: [{ x: 0, y: GY, w: 700, h: 160 }, { x: 820, y: GY, w: 900, h: 160 }, { x: 1830, y: GY, w: 970, h: 160 }],
    crates: [{ x: 1860, y: GY - 56 }],
    plates: [{ x: 2020, y: GY - 8, w: 90, h: 8, door: 0 }], doors: [{ x: 2330, y: 300, w: 30, h: 260 }],
    spikes: [{ x: 1000, y: GY - 24, w: 90, h: 24 }, { x: 2190, y: GY - 24, w: 80, h: 24 }],
    saws: [{ x1: 1250, x2: 1550, y: GY - 30, r: 30, period: 3.6 }], checkpoints: [850, 1850],
    exit: { x: 2650, y: GY - 100, w: 70, h: 100 } },
];

/* ============ Durum ============ */
const P = { x: 0, y: 0, w: 26, h: 54, vx: 0, vy: 0, face: 1, onGround: false, standing: null, coyote: 0, jumpReq: 0, grab: false, anim: 0, squash: 0, dx: 0 };
let lvlIdx = 0, L = null, crates = [], plates = [], doors = [], saws = [], cp = null, cpSnap = null;
let mode = "menu", fade = 1, fadeTarget = 0, deadT = 0, T = 0, cam = 0, titleT = 0, unlocked = 1;
const keys = {}, touch = {};

function loadLevel(i) {
  lvlIdx = i; L = LEVELS[i];
  crates = L.crates.map((c) => ({ x: c.x, y: c.y, w: 56, h: 56, vy: 0, dx: 0, x0: c.x, y0: c.y }));
  plates = L.plates.map((p) => ({ ...p, pressed: false }));
  doors = L.doors.map((d) => ({ ...d, open: 0 }));
  saws = L.saws.map((s) => ({ ...s, x: s.x1 }));
  cp = { x: L.start.x, y: L.start.y, idx: -1 }; snapshot();
  respawn(); titleT = 3; cam = 0; mode = "play"; fade = 1; fadeTarget = 0;
  document.getElementById("menu").hidden = true;
}
function snapshot() { cpSnap = crates.map((c) => ({ x: c.x, y: c.y })); }
function respawn() {
  Object.assign(P, { x: cp.x, y: cp.y, vx: 0, vy: 0, face: 1, onGround: false, standing: null, grab: false });
  crates.forEach((c, i) => { c.x = cpSnap[i].x; c.y = cpSnap[i].y; c.vy = 0; });
}
function die() { if (mode !== "play") return; mode = "dead"; deadT = 0; fadeTarget = 1; burst(P.x + 13, P.y + 27); }

/* ============ Fizik ============ */
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const doorBlocks = (d) => d.open < 0.6;
const doorRect = (d) => ({ x: d.x, y: d.y, w: d.w, h: d.h * (1 - d.open) });
function worldSolids() { const s = L.statics.slice(); for (const d of doors) if (doorBlocks(d)) s.push(doorRect(d)); return s; }

function crateMoveX(c, d) {
  const old = c.x; c.x += d;
  for (const r of worldSolids()) if (ov(c, r)) c.x = d > 0 ? r.x - c.w : r.x + r.w;
  c.dx += c.x - old; return c.x - old;
}
function moveX(dx) {
  if (!dx) return;
  P.x += dx;
  for (const s of worldSolids()) if (ov(P, s)) P.x = dx > 0 ? s.x - P.w : s.x + s.w;
  for (const c of crates) if (ov(P, c)) {
    if (P.y + P.h <= c.y + 4) continue;
    crateMoveX(c, dx > 0 ? P.x + P.w - c.x : P.x - (c.x + c.w));
    if (ov(P, c)) P.x = dx > 0 ? c.x - P.w : c.x + c.w;
  }
}
function moveY(dy) {
  const prevBottom = P.y + P.h; P.y += dy;
  const solids = worldSolids().concat(crates);
  for (const s of solids) if (ov(P, s)) {
    if (dy > 0) { P.y = s.y - P.h; if (P.vy > 420) P.squash = 0.14; P.vy = 0; P.onGround = true; P.standing = crates.includes(s) ? s : null; }
    else if (dy < 0) { P.y = s.y + s.h; P.vy = 0; }
  }
}
function stepCrates(dt) {
  for (const c of crates) {
    c.dx = 0; c.vy += G * dt; c.y += c.vy * dt;
    for (const r of worldSolids()) if (ov(c, r)) { if (c.vy > 0) c.y = r.y - c.h; else c.y = r.y + r.h; c.vy = 0; }
    if (c.y > H + 200) { c.x = c.x0; c.y = c.y0; c.vy = 0; }
  }
}
function adjacentCrate() {
  for (const c of crates) {
    const vert = P.y + P.h > c.y + 6 && P.y < c.y + c.h;
    if (!vert) continue;
    if (Math.abs(P.x + P.w - c.x) < 5) return { c, side: 1 };
    if (Math.abs(c.x + c.w - P.x) < 5) return { c, side: -1 };
  }
  return null;
}

function step(dt) {
  T += dt;
  if (mode === "dead") { deadT += dt; if (deadT > 0.7) { respawn(); mode = "play"; fadeTarget = 0; } }
  if (mode === "win") { deadT += dt; if (deadT > 1.1) nextLevel(); }
  // fade
  fade += (fadeTarget - fade) * Math.min(1, dt * 5);
  titleT = Math.max(0, titleT - dt);
  // plateler, kapılar
  for (const p of plates) p.pressed = ov(P, p) || crates.some((c) => ov(c, { x: p.x, y: p.y - 2, w: p.w, h: p.h + 4 }));
  doors.forEach((d, i) => {
    const hold = plates.some((p) => p.door === i && p.pressed) ||
      (d.open > 0.3 && (ov(P, { x: d.x - 4, y: d.y, w: d.w + 8, h: d.h }) || crates.some((c) => ov(c, { x: d.x - 4, y: d.y, w: d.w + 8, h: d.h }))));
    d.open += ((hold ? 1 : 0) - d.open) * Math.min(1, dt * 5); if (hold && d.open > 0.98) d.open = 1;
  });
  for (const s of saws) { const k = (Math.sin(T * 2 * Math.PI / s.period) + 1) / 2; s.x = s.x1 + (s.x2 - s.x1) * k; s.rot = (s.rot || 0) + dt * 9; }
  stepCrates(dt);
  if (mode !== "play") { P.vx = 0; return; }

  const grounded = P.onGround;
  P.dx = 0; P.onGround = false; P.standing = null;
  const k = inputState();
  const adj = adjacentCrate();
  P.grab = k.grab && grounded && !!adj;
  const dir = (k.right ? 1 : 0) - (k.left ? 1 : 0);
  let speed = P.grab ? 110 : 210;
  if (dir && !P.grab) P.face = dir;
  if (P.grab) P.face = adj.side;
  const acc = (grounded ? 3200 : 1700) * dt, target = dir * speed;
  P.vx += Math.max(-acc, Math.min(acc, target - P.vx));
  P.coyote = grounded ? 0.1 : P.coyote - dt;
  if (P.jumpReq > 0) P.jumpReq -= dt;
  if (P.jumpReq > 0 && P.coyote > 0) { P.vy = -700; P.coyote = 0; P.jumpReq = 0; }
  if (!k.jump && P.vy < -260) P.vy *= 0.6;
  P.vy += G * dt;
  const before = P.x;
  // üstünde durduğu kutuyla taşın
  if (P.standLast) moveX(P.standLast.dx);
  moveX(P.vx * dt);
  const moved = P.x - before;
  if (P.grab && adj && ((adj.side > 0 && moved < 0) || (adj.side < 0 && moved > 0))) {
    const got = crateMoveX(adj.c, moved);
    if (Math.abs(got - moved) > 0.01) P.x -= moved - got;   // kutu sıkıştıysa çekme
  }
  moveY(P.vy * dt);
  P.standLast = P.standing;
  if (P.squash > 0) P.squash -= dt;
  if (Math.abs(P.vx) > 20 && grounded) { P.anim += dt * Math.abs(P.vx) / 22; if (Math.floor(P.anim * 2) % 2 === 0 && Math.random() < 0.02) dust(P.x + 13, P.y + P.h); }
  // checkpoint
  L.checkpoints.forEach((x, i) => { if (i > cp.idx && P.x > x) { cp = { x: x, y: P.y, idx: i }; snapshot(); } });
  // tehlikeler
  const body = { x: P.x + 4, y: P.y + 6, w: P.w - 8, h: P.h - 8 };
  for (const s of L.spikes) if (ov(body, { x: s.x + 6, y: s.y + 4, w: s.w - 12, h: s.h })) die();
  for (const s of saws) if (Math.hypot(P.x + 13 - s.x, P.y + 27 - s.y) < s.r + 14) die();
  if (P.y > H + 80) die();
  if (ov(P, L.exit) && mode === "play") { mode = "win"; deadT = 0; fadeTarget = 1; unlocked = Math.max(unlocked, lvlIdx + 2); }
}
function nextLevel() {
  if (lvlIdx + 1 < LEVELS.length) loadLevel(lvlIdx + 1);
  else { mode = "menu"; document.getElementById("end").hidden = false; }
}

/* ============ Girdi ============ */
const keyMap = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "jump", KeyW: "jump", Space: "jump", ShiftLeft: "grab", ShiftRight: "grab", KeyE: "grab" };
function setKey(t, k, v) { if (k === "jump" && v && !t.jump) P.jumpReq = 0.12; t[k] = v; }
addEventListener("keydown", (e) => { if (e.code === "KeyR" && mode === "play") die(); const k = keyMap[e.code]; if (k) { setKey(keys, k, true); e.preventDefault(); } });
addEventListener("keyup", (e) => { const k = keyMap[e.code]; if (k) setKey(keys, k, false); });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("down"); setKey(touch, k, true); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((n) => b.addEventListener(n, () => { b.classList.remove("down"); setKey(touch, k, false); }));
  b.addEventListener("contextmenu", (e) => e.preventDefault());
}
const inputState = () => ({ left: keys.left || touch.left, right: keys.right || touch.right, jump: keys.jump || touch.jump, grab: keys.grab || touch.grab });

/* ============ Parçacıklar ============ */
const parts = [];
function dust(x, y) { parts.push({ x, y, vx: (Math.random() - .5) * 30, vy: -10 - Math.random() * 20, life: .5, max: .5, r: 2 + Math.random() * 2, c: 0 }); }
function burst(x, y) { for (let i = 0; i < 24; i++) { const a = Math.random() * 7; parts.push({ x, y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140 - 60, life: .7, max: .7, r: 2 + Math.random() * 3, c: 1 }); } }

/* ============ Çizim ============ */
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const trees = [0, 1, 2].map((layer) => { const r = rnd(11 + layer * 7), a = []; let x = -100;
  while (x < 4200) { a.push({ x, h: 220 + r() * 260 + layer * 40, w: 60 + r() * 50 + layer * 10, t: 4 + (r() * 3 | 0) }); x += 90 + r() * 190 - layer * 20; } return a; });
const fogTex = (() => { const c = document.createElement("canvas"); c.width = 1024; c.height = 256; const x = c.getContext("2d"), r = rnd(5);
  for (let i = 0; i < 22; i++) { const px = r() * 1024, py = 70 + r() * 120, rad = 80 + r() * 110;
    for (const o of [-1024, 0, 1024]) { const g = x.createRadialGradient(px + o, py, 0, px + o, py, rad);   // yatayda kesintisiz döşenir
      g.addColorStop(0, "rgba(230,232,235,.35)"); g.addColorStop(1, "rgba(230,232,235,0)"); x.fillStyle = g; x.fillRect(px + o - rad, py - rad, rad * 2, rad * 2); } }
  x.globalCompositeOperation = "destination-in"; const m = x.createLinearGradient(0, 0, 0, 256);   // üst/alt kenarda sert çizgi olmasın
  m.addColorStop(0, "rgba(0,0,0,0)"); m.addColorStop(0.35, "#000"); m.addColorStop(0.65, "#000"); m.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = m; x.fillRect(0, 0, 1024, 256); return c; })();
const grain = (() => { const c = document.createElement("canvas"); c.width = c.height = 200; const x = c.getContext("2d"), d = x.createImageData(200, 200);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; })();
const grainPat = ctx.createPattern(grain, "repeat");

function pine(x, base, h, w, tiers, col) {
  ctx.fillStyle = col; ctx.beginPath();
  const th = h / tiers; ctx.moveTo(x, base - h);
  for (let i = 1; i <= tiers; i++) { const yy = base - h + th * i, ww = w * i / tiers; ctx.lineTo(x + ww / 2, yy); ctx.lineTo(x + ww / 3, yy); }
  for (let i = tiers; i >= 1; i--) { const yy = base - h + th * i, ww = w * i / tiers; ctx.lineTo(x - ww / 3, yy); ctx.lineTo(x - ww / 2, yy); }
  ctx.closePath(); ctx.fill(); ctx.fillRect(x - 4, base - 30, 8, 40);
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#74777c"); g.addColorStop(0.55, "#b5b7ba"); g.addColorStop(1, "#8b8d91");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sx = 900 - cam * 0.03, rg = ctx.createRadialGradient(sx, 200, 0, sx, 200, 520); rg.addColorStop(0, "rgba(255,255,255,.55)"); rg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  const cols = ["#6d7075", "#4a4c50", "#2a2b2e"], par = [0.2, 0.42, 0.7];
  for (let l = 0; l < 3; l++) {
    for (const t of trees[l]) { const x = t.x - cam * par[l]; if (x < -150 || x > W + 150) continue; pine(x, 590 + l * 20, t.h * (0.75 + l * 0.15), t.w, t.t, cols[l]); }
    const fo = (T * (8 + l * 5) + cam * par[l] * 0.5) % 1024; ctx.globalAlpha = 0.55 - l * 0.1;
    for (let k = -1; k < 3; k++) ctx.drawImage(fogTex, k * 1024 - fo, 320 + l * 70, 1024, 256);
    ctx.globalAlpha = 1;
  }
  // ışık huzmeleri
  ctx.fillStyle = "rgba(255,255,255,.07)";
  for (let i = 0; i < 4; i++) { const bx = 300 + i * 330 - (cam * 0.35) % 330; ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 90, 0); ctx.lineTo(bx - 140, H); ctx.lineTo(bx - 330, H); ctx.fill(); }
}
function drawWorld() {
  ctx.save(); ctx.translate(-cam, 0);
  // zemin: siyah + pürüzlü üst
  ctx.fillStyle = "#0b0b0c";
  for (const s of L.statics) {
    ctx.fillRect(s.x, s.y, s.w, s.h);
    if (s.y <= 560) { const r = rnd(s.x + 3); ctx.beginPath(); ctx.moveTo(s.x, s.y);
      for (let x = s.x; x < s.x + s.w; x += 9) ctx.lineTo(x + 4, s.y - 4 - r() * 10), ctx.lineTo(x + 9, s.y); ctx.fill(); }
  }
  // çıkış ışığı
  const e = L.exit, eg = ctx.createRadialGradient(e.x + 35, e.y + 50, 5, e.x + 35, e.y + 50, 150); eg.addColorStop(0, "rgba(255,255,255,.9)"); eg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = eg; ctx.fillRect(e.x - 120, e.y - 100, 310, 320);
  ctx.fillStyle = "#f4f4f2"; ctx.fillRect(e.x + 10, e.y + 6, e.w - 20, e.h - 6);
  // plate
  for (const p of plates) { ctx.fillStyle = "#0b0b0c"; ctx.fillRect(p.x - 8, GY - 4, p.w + 16, 6); ctx.fillStyle = p.pressed ? "#3a3c40" : "#55575c"; ctx.fillRect(p.x, p.pressed ? GY - 4 : GY - 10, p.w, p.pressed ? 2 : 8); }
  // kapılar
  for (const d of doors) { const r = doorRect(d); if (r.h > 2) { ctx.fillStyle = "#0b0b0c"; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.fillStyle = "#2c2d30"; ctx.fillRect(r.x + 8, r.y, 4, r.h); } }
  // dikenler
  ctx.fillStyle = "#0b0b0c";
  for (const s of L.spikes) { ctx.beginPath(); for (let x = s.x; x < s.x + s.w; x += 12) { ctx.moveTo(x, s.y + s.h); ctx.lineTo(x + 6, s.y); ctx.lineTo(x + 12, s.y + s.h); } ctx.fill(); }
  // testereler
  for (const s of saws) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.fillStyle = "#0b0b0c"; ctx.beginPath();
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r1 = i % 2 ? s.r - 8 : s.r + 3; ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); } ctx.fill();

/* Geçici silüet karakter (tasarım gelince sprite ile değişecek) */
function drawPlayer() {

  const sq = P.squash > 0 ? 1 - P.squash * 1.5 : 1;

  const leg = (a) => { ctx.beginPath(); ctx.moveTo(0, -24); const kx = Math.sin(a) * 10, ky = -12; ctx.lineTo(kx, ky); ctx.lineTo(kx + Math.sin(a - 0.4) * 5, 0); ctx.stroke(); };
  if (!P.onGround) { leg(0.9); leg(-0.5); } else if (run) { leg(Math.sin(ph)); leg(-Math.sin(ph)); } else { leg(0.15); leg(-0.15); }
  // gövde

  else { const s = run ? Math.sin(ph) * 10 : 0; ctx.beginPath(); ctx.moveTo(1, -38 - bob); ctx.lineTo(4 + s, -26 - bob); ctx.moveTo(1, -38 - bob); ctx.lineTo(-s, -27 - bob); ctx.stroke(); }

function drawFront() {

  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.62)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.07; ctx.save(); ctx.translate(Math.random() * 200, Math.random() * 200); ctx.fillStyle = grainPat; ctx.fillRect(-200, -200, W + 400, H + 400); ctx.restore(); ctx.globalAlpha = 1;
  if (titleT > 0 && L) { ctx.globalAlpha = Math.min(1, titleT) * 0.9; ctx.fillStyle = "#fff"; ctx.font = "200 34px system-ui"; ctx.textAlign = "center"; ctx.fillText(`${lvlIdx + 1}  ·  ${L.name.toUpperCase()}`, W / 2, 110); ctx.textAlign = "left"; ctx.globalAlpha = 1; }
  ctx.fillStyle = `rgba(0,0,0,${Math.max(0, Math.min(1, fade))})`; ctx.fillRect(0, 0, W, H);

function draw() {

let acc = 0, last = performance.now();

/* ============ Menü ============ */
function buildMenu() {
  const lv = document.getElementById("lv"); lv.innerHTML = "";
  LEVELS.forEach((l, i) => { const b = document.createElement("button"); b.textContent = `${i + 1} ${l.name}`; b.onclick = () => { document.getElementById("end").hidden = true; loadLevel(i); }; lv.appendChild(b); });

document.getElementById("toMenu").onclick = () => { document.getElementById("end").hidden = true; document.getElementById("menu").hidden = false; };

addEventListener("resize", checkRot); checkRot();

requestAnimationFrame(frame);
