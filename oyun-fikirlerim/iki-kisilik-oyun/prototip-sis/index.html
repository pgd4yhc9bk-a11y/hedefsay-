<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sis</title>
<style>
  :root { color-scheme: dark; --bg:#0b0b0c; --text:#d9dadd; --mute:#8e9094; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #root { height:100%; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; background:#000; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .pad { position:absolute; bottom:max(10px, env(safe-area-inset-bottom,0px)); display:flex; gap:10px; }
  .pad.l { left:max(14px, env(safe-area-inset-left,0px)); } .pad.r { right:max(14px, env(safe-area-inset-right,0px)); }
  .pad button { width:clamp(52px,10vw,82px); height:clamp(52px,10vw,82px); border-radius:50%; border:2px solid #ffffff40;
    background:#0008; color:#fff; font-size:clamp(20px,4vw,30px); opacity:.65; }
  .pad button.down { opacity:1; background:#fff3; transform:scale(.94); }
  @media (pointer:fine) { .pad { display:none; } }
  #menu { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at center, #0000 0%, #000c 100%); text-align:center; }
  #menu[hidden], #rot[hidden], #end[hidden] { display:none; }
  #menu h1 { margin:0; font-size:clamp(40px,9vw,88px); letter-spacing:.5em; padding-left:.5em; font-weight:200; color:#e9eaec; text-shadow:0 0 30px #fff5; }
  #menu .sub { color:var(--mute); letter-spacing:.2em; font-size:12px; text-transform:uppercase; }
  .lv { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .lv button, #menu .go { background:none; border:1px solid #ffffff50; color:#e9eaec; padding:10px 22px; font:inherit; letter-spacing:.2em; text-transform:uppercase; border-radius:2px; }
  .lv button:hover, #menu .go:hover { background:#ffffff18; }
  #help { color:var(--mute); font-size:12px; letter-spacing:.05em; }
  @media (pointer:coarse) { #help { display:none; } }
  #rot { position:fixed; inset:0; background:#000e; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  #end { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#000d; text-align:center; letter-spacing:.1em; }
  #end button { background:none; border:1px solid #ffffff50; color:#e9eaec; padding:10px 22px; font:inherit; letter-spacing:.2em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="root"><div id="stage">
  <canvas id="cv"></canvas>
  <div class="pad l"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="pad r"><button data-k="mask">🎭</button><button data-k="grab">✋</button><button data-k="jump">⤒</button></div>
  <div id="menu">
    <div class="sub">Çalışma adı</div><h1>SİS</h1>
    <div class="lv" id="lv"></div>
    <div class="lv"><button id="snd">Ses: açık</button></div>
    <div id="help">← → / A D yürü · ↑ / W / Boşluk zıpla · Shift / E tut ve çek · Q / F maske (tak, fırlat) · R yeniden</div>
  </div>
  <div id="end" hidden><div style="font-size:22px">Bölümler bitti</div><div style="color:#8e9094">Sıradaki: ikinci oyuncu ve sesli co-op</div><button id="toMenu">Menü</button></div>
</div></div>
<div id="rot" hidden><div style="font-size:40px">📱↻</div><div>Telefonu yatay çevirin</div></div>

<script>
"use strict";
const W = 1280, H = 720, G = 2300, DT = 1 / 120;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const SC = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * SC; cv.height = H * SC;

/* ============ Bölümler (veri) ============ */
const GY = 560;
const LEVELS = [
  { name: "Sis", w: 2700, start: { x: 60, y: GY - 54 },
    statics: [{ x: 0, y: GY, w: 800, h: 160 }, { x: 870, y: GY, w: 630, h: 160 }, { x: 1100, y: 500, w: 60, h: 60 },
              { x: 1500, y: 430, w: 400, h: 290 }, { x: 1900, y: GY, w: 800, h: 160 }],
    crates: [{ x: 1250, y: GY - 56 }], plates: [], doors: [],
    spikes: [{ x: 2000, y: GY - 24, w: 48, h: 24 }], saws: [], checkpoints: [900, 1950],
    exit: { x: 2550, y: GY - 100, w: 70, h: 100 } },
  { name: "Ağırlık", w: 2500, start: { x: 60, y: GY - 54 },
    statics: [{ x: 0, y: GY, w: 1500, h: 160 }, { x: 1570, y: GY, w: 340, h: 160 }, { x: 1910, y: 430, w: 590, h: 290 }],
    crates: [{ x: 300, y: GY - 56 }, { x: 1700, y: GY - 56 }],
    plates: [{ x: 700, y: GY - 8, w: 90, h: 8, door: 0 }], doors: [{ x: 1000, y: 300, w: 30, h: 260 }],
    spikes: [], saws: [], checkpoints: [1060, 1650],
    exit: { x: 2300, y: 330, w: 70, h: 100 } },
  { name: "Testere", w: 2800, start: { x: 60, y: GY - 54 }, hint: "Testere yukarı çıkınca altından geç",
    statics: [{ x: 0, y: GY, w: 700, h: 160 }, { x: 770, y: GY, w: 950, h: 160 }, { x: 1790, y: GY, w: 1010, h: 160 }],
    crates: [{ x: 1860, y: GY - 56 }],
    plates: [{ x: 2020, y: GY - 8, w: 90, h: 8, door: 0 }], doors: [{ x: 2330, y: 300, w: 30, h: 260 }],
    spikes: [{ x: 1000, y: GY - 24, w: 48, h: 24 }, { x: 2190, y: GY - 24, w: 48, h: 24 }],
    saws: [{ x1: 1400, x2: 1400, y1: GY - 22, y2: GY - 160, r: 26, period: 2.8 }], checkpoints: [850, 1850],
    exit: { x: 2650, y: GY - 100, w: 70, h: 100 } },
  { name: "Kabuk", w: 2000, start: { x: 60, y: GY - 54 }, hint: "Q / 🎭: maskeyi al · tekrar bas: fırlat · maske ağırdır, düğmeye basar",
    statics: [{ x: 0, y: GY, w: 1300, h: 160 }, { x: 1370, y: GY, w: 630, h: 160 }],
    mask: { x: 190, y: GY - 70 }, crates: [],
    plates: [{ x: 560, y: GY - 8, w: 90, h: 8, door: 0, heavy: true }], doors: [{ x: 820, y: 300, w: 30, h: 260 }],
    spikes: [], saws: [], checkpoints: [900, 1420], exit: { x: 1850, y: GY - 100, w: 70, h: 100 } },
  { name: "Kalkan", w: 2300, start: { x: 60, y: GY - 54 }, hint: "Maske takılıyken oklara dön: kalkan olur. Çıkarırsan siper veya basamak olur",
    statics: [{ x: 0, y: GY, w: 2300, h: 160 }, { x: 1750, y: 420, w: 550, h: 300 }],
    mask: { worn: true }, crates: [], plates: [], doors: [],
    darts: [{ x: 1746, y: GY - 30, dir: -1, every: 1.7, phase: 0.4 }, { x: 1746, y: GY - 46, dir: -1, every: 1.7, phase: 1.25 }],
    spikes: [], saws: [], checkpoints: [900, 1450], exit: { x: 2100, y: 320, w: 70, h: 100 } },
  { name: "Sular", w: 2100, start: { x: 60, y: GY - 54 }, hint: "Maske suda yüzer: fırlat, üstüne çık, karşıya geç",
    statics: [{ x: 0, y: GY, w: 700, h: 160 }, { x: 870, y: GY, w: 1230, h: 160 }, { x: 1560, y: 430, w: 540, h: 290 }],
    water: [{ x: 700, y: GY + 8, w: 170 }], mask: { x: 300, y: GY - 70 }, crates: [{ x: 1150, y: GY - 56 }],
    plates: [], doors: [], spikes: [], saws: [], checkpoints: [920], exit: { x: 1950, y: 330, w: 70, h: 100 } },
];

/* ============ Durum ============ */
const P = { x: 0, y: 0, w: 26, h: 54, vx: 0, vy: 0, face: 1, onGround: false, standing: null, coyote: 0, jumpReq: 0, grab: false, anim: 0, squash: 0, dx: 0 };
let lvlIdx = 0, L = null, crates = [], plates = [], doors = [], saws = [], darts = [], arrows = [], cp = null, cpSnap = null;
const M = { kind: "mask", state: "none", w: 40, h: 68, x: 0, y: 0, vx: 0, vy: 0, dx: 0, x0: 0, y0: 0, onGround: false };   // Kabuk'un maskesi: none | worn | ground
const bodies = () => (M.state === "ground" ? crates.concat([M]) : crates);
let lastDrag = 0, shakeT = 0, look = 0;
const shake = (a) => { shakeT = Math.max(shakeT, Math.min(1, a)); };
let mode = "menu", fade = 1, fadeTarget = 0, deadT = 0, T = 0, cam = 0, titleT = 0, unlocked = 1;
const keys = {}, touch = {};

function loadLevel(i) {
  lvlIdx = i; L = LEVELS[i];
  crates = L.crates.map((c) => ({ kind: "crate", x: c.x, y: c.y, w: 56, h: 56, vx: 0, vy: 0, dx: 0, x0: c.x, y0: c.y, onGround: false }));
  if (!L.mask) M.state = "none";
  else if (L.mask.worn) { M.state = "worn"; M.x0 = L.start.x; M.y0 = L.start.y; }
  else { M.state = "ground"; M.x = M.x0 = L.mask.x; M.y = M.y0 = L.mask.y; }
  darts = (L.darts || []).map((d) => ({ ...d, t: d.phase || 0 })); arrows = [];
  plates = L.plates.map((p) => ({ ...p, pressed: false }));
  doors = L.doors.map((d) => ({ ...d, open: 0 }));
  saws = L.saws.map((s) => ({ ...s, x: s.x1, y: s.y1 ?? s.y }));
  cp = { x: L.start.x, y: L.start.y, idx: -1 }; snapshot();
  respawn(); titleT = L.hint ? 6 : 3; cam = 0; mode = "play"; fade = 1; fadeTarget = 0;
  document.getElementById("menu").hidden = true;
}
function snapshot() { cpSnap = { c: crates.map((c) => ({ x: c.x, y: c.y })), m: { state: M.state, x: M.x, y: M.y } }; }
function respawn() {
  Object.assign(P, { x: cp.x, y: cp.y, vx: 0, vy: 0, face: 1, onGround: false, standing: null, grab: false });
  crates.forEach((c, i) => { c.x = cpSnap.c[i].x; c.y = cpSnap.c[i].y; c.vx = c.vy = 0; });
  if (L.mask) { M.state = cpSnap.m.state; M.x = cpSnap.m.x; M.y = cpSnap.m.y; M.vx = M.vy = 0; }
  arrows = [];
}
function die() { if (mode !== "play") return; sfx.die(); shake(0.6); mode = "dead"; deadT = 0; fadeTarget = 1; burst(P.x + 13, P.y + 27); }

/* ============ Fizik ============ */
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const doorBlocks = (d) => d.open < 0.6;
const doorRect = (d) => ({ x: d.x, y: d.y, w: d.w, h: d.h * (1 - d.open) });
function worldSolids() { const s = L.statics.slice(); for (const d of doors) if (doorBlocks(d)) s.push(doorRect(d)); return s; }

function crateMoveX(c, d) {
  const old = c.x; c.x += d;
  for (const r of worldSolids()) if (ov(c, r)) c.x = d > 0 ? r.x - c.w : r.x + r.w;
  c.dx += c.x - old; return c.x - old;
}
function moveX(dx) {
  if (!dx) return;
  P.x += dx;
  for (const s of worldSolids()) if (ov(P, s)) P.x = dx > 0 ? s.x - P.w : s.x + s.w;
  for (const c of bodies()) if (ov(P, c)) {
    if (P.y + P.h <= c.y + 4) continue;
    crateMoveX(c, dx > 0 ? P.x + P.w - c.x : P.x - (c.x + c.w));
    if (ov(P, c)) P.x = dx > 0 ? c.x - P.w : c.x + c.w;
  }
}
function moveY(dy) {
  const prevBottom = P.y + P.h; P.y += dy;
  const solids = worldSolids().concat(bodies());
  for (const s of solids) if (ov(P, s)) {
    if (dy > 0 && prevBottom > s.y + 8) continue;                 // yandan kenara sürtünme: yatay çözüm halleder
    if (dy < 0 && prevBottom - P.h < s.y + s.h - 8) continue;
    if (dy > 0) { P.y = s.y - P.h; if (P.vy > 300) { P.squash = Math.min(0.22, 0.06 + P.vy / 4500); sfx.land(P.vy); shake(P.vy / 1400); if (P.vy > 720) P.recover = 0.3; } P.vy = 0; P.onGround = true; P.standing = bodies().includes(s) ? s : null; }
    else if (dy < 0) { P.y = s.y + s.h; P.vy = 0; }
  }
}
function stepCrates(dt) {
  for (const c of bodies()) {
    c.dx = 0;
    if (c.vx) { crateMoveX(c, c.vx * dt); if (c.onGround) c.vx *= Math.max(0, 1 - 10 * dt); if (Math.abs(c.vx) < 5) c.vx = 0; }
    c.vy += G * dt; c.y += c.vy * dt; c.onGround = false;
    for (const r of worldSolids()) if (ov(c, r)) { if (c.vy > 0) { c.y = r.y - c.h; c.onGround = true; } else c.y = r.y + r.h; c.vy = 0; }
    if (c.kind === "mask") for (const w of L.water || []) {   // maske suda yüzer, kasa batar
      const cx = c.x + c.w / 2;
      if (cx > w.x && cx < w.x + w.w && c.y + c.h > w.y + 12 && c.y < w.y + 160) { c.y = w.y + 12 - c.h; c.vy = 0; c.vx *= 0.98; c.onGround = true; }
    }
    if (c.y > H + 200) { c.x = c.x0; c.y = c.y0; c.vx = c.vy = 0; }
  }
}
function adjacentCrate() {
  for (const c of bodies()) {
    const vert = P.y + P.h > c.y + 6 && P.y < c.y + c.h;
    if (!vert) continue;
    if (Math.abs(P.x + P.w - c.x) < 5) return { c, side: 1 };
    if (Math.abs(c.x + c.w - P.x) < 5) return { c, side: -1 };
  }
  return null;
}

function maskAction() {
  if (M.state === "worn") {                                   // fırlat
    const x = P.face > 0 ? P.x + P.w + 2 : P.x - M.w - 2, y = P.y + P.h - M.h, r = { x, y, w: M.w, h: M.h };
    if (worldSolids().some((s) => ov(r, s)) || crates.some((c) => ov(r, c))) return;
    Object.assign(M, { state: "ground", x, y, vx: 260 * P.face, vy: -380 }); sfx.whoosh();
  } else if (M.state === "ground" && ov({ x: P.x - 30, y: P.y - 10, w: P.w + 60, h: P.h + 20 }, M)) {   // al
    M.state = "worn"; M.vx = M.vy = 0; sfx.clink();
  }
}
function stepArrows(dt) {
  for (const d of darts) { d.t += dt; if (d.t >= d.every) { d.t -= d.every; arrows.push({ x: d.dir < 0 ? d.x - 26 : d.x, y: d.y, w: 26, h: 6, vx: d.dir * 420 }); if (Math.abs(d.x - P.x) < 900) sfx.fire(); } }
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i]; a.x += a.vx * dt;
    if (a.x < -60 || a.x > L.w + 60) { arrows.splice(i, 1); continue; }
    if (worldSolids().some((s) => ov(a, s)) || bodies().some((c) => ov(a, c))) { spark(a.x, a.y); arrows.splice(i, 1); continue; }
    const body = { x: P.x + 2, y: P.y + 4, w: P.w - 4, h: P.h - 4 };
    if (mode === "play" && ov(a, body)) {
      if (M.state === "worn" && Math.sign(a.vx) === -P.face) { spark(a.x, a.y); arrows.splice(i, 1); } else die();
    }
  }
}
function step(dt) {
  T += dt;
  if (mode === "dead") { deadT += dt; if (deadT > 0.7) { respawn(); mode = "play"; fadeTarget = 0; } }
  if (mode === "win") { deadT += dt; if (deadT > 1.1) nextLevel(); }
  // fade
  fade += (fadeTarget - fade) * Math.min(1, dt * 5);
  titleT = Math.max(0, titleT - dt);
  // plateler, kapılar
  for (const p of plates) p.was = p.pressed;
  for (const p of plates) p.pressed = (!p.heavy && ov(P, p)) || bodies().some((c) => ov(c, { x: p.x, y: p.y - 2, w: p.w, h: p.h + 4 }));
  for (const p of plates) if (p.was !== undefined && p.was !== p.pressed) sfx.plate();
  doors.forEach((d, i) => {
    const hold = plates.some((p) => p.door === i && p.pressed) ||
      (d.open > 0.3 && (ov(P, { x: d.x - 4, y: d.y, w: d.w + 8, h: d.h }) || bodies().some((c) => ov(c, { x: d.x - 4, y: d.y, w: d.w + 8, h: d.h }))));
    if ((hold && d.open < 0.02) || (!hold && d.open > 0.98)) sfx.door();
    d.open += ((hold ? 1 : 0) - d.open) * Math.min(1, dt * 5); if (hold && d.open > 0.98) d.open = 1;
  });
  for (const s of saws) { const k = (Math.sin(T * 2 * Math.PI / s.period) + 1) / 2; s.x = s.x1 + (s.x2 - s.x1) * k; if (s.y1 !== undefined) s.y = s.y1 + (s.y2 - s.y1) * k; s.rot = (s.rot || 0) + dt * 9; }
  stepCrates(dt); stepArrows(dt);
  if (mode !== "play") { P.vx = 0; return; }
  if (P.maskReq) { P.maskReq = false; if (M.state !== "none") maskAction(); }

  const grounded = P.onGround;
  P.dx = 0; P.onGround = false; P.standing = null;
  const k = inputState();
  const adj = adjacentCrate();
  P.grab = k.grab && grounded && !!adj;
  const dir = (k.right ? 1 : 0) - (k.left ? 1 : 0);
  const worn = M.state === "worn";
  if (P.recover > 0) P.recover -= dt;
  let speed = (P.grab ? 85 : worn ? 120 : 165) * (P.recover > 0 ? 0.35 : 1);
  if (dir && !P.grab) P.face = dir;
  if (P.grab) P.face = adj.side;
  const acc = (grounded ? (dir ? 900 : 1500) : 260) * dt, target = dir * speed;   // yerde ivmeli, havada momentum korunur
  P.vx += Math.max(-acc, Math.min(acc, target - P.vx));
  P.coyote = grounded ? 0.1 : P.coyote - dt;
  if (P.jumpReq > 0) P.jumpReq -= dt;
  if (P.jumpReq > 0 && P.coyote > 0) { P.vy = worn ? -560 : -660; P.coyote = 0; P.jumpReq = 0; sfx.jump(); }
  if (!k.jump && P.vy < -200) P.vy *= 0.55;
  P.vy = Math.min(950, P.vy + G * dt);
  const before = P.x;
  // üstünde durduğu kutuyla taşın
  if (P.standLast) moveX(P.standLast.dx);
  moveX(P.vx * dt);
  const moved = P.x - before;
  if (P.grab && adj && ((adj.side > 0 && moved < 0) || (adj.side < 0 && moved > 0))) {
    const got = crateMoveX(adj.c, moved);
    if (Math.abs(got - moved) > 0.01) P.x -= moved - got;   // kutu sıkıştıysa çekme
  }
  moveY(P.vy * dt);
  P.standLast = P.standing;
  if (P.squash > 0) P.squash -= dt;
  if (Math.abs(P.vx) > 20 && grounded) {
    P.anim += dt * Math.abs(P.vx) / 50;
    const f = Math.floor(P.anim); if (f !== P.lastStep) { P.lastStep = f; sfx.step(); if (Math.abs(P.vx) > 90) dust(P.x + 13, P.y + P.h); }
  }
  if (grounded && adj && P.grab && Math.abs(moved) > 0.05 && T - lastDrag > 0.16) { lastDrag = T; sfx.drag(); }
  // checkpoint
  L.checkpoints.forEach((x, i) => { if (i > cp.idx && P.x > x) { cp = { x: x, y: P.y, idx: i }; snapshot(); } });
  // tehlikeler
  const body = { x: P.x + 4, y: P.y + 6, w: P.w - 8, h: P.h - 8 };
  for (const s of L.spikes) if (ov(body, { x: s.x + 6, y: s.y + 4, w: s.w - 12, h: s.h })) die();
  for (const s of saws) if (Math.hypot(P.x + 13 - s.x, P.y + 27 - s.y) < s.r + 14) die();
  if (P.y > H + 80) die();
  if (ov(P, L.exit) && mode === "play") { mode = "win"; sfx.win(); deadT = 0; fadeTarget = 1; unlocked = Math.max(unlocked, lvlIdx + 2); }
}
function nextLevel() {
  if (lvlIdx + 1 < LEVELS.length) loadLevel(lvlIdx + 1);
  else { mode = "menu"; document.getElementById("end").hidden = false; }
}

/* ============ Ses (Web Audio ile üretilir) ============ */
const sfx = (() => {
  let ac = null, master = null, nb = null, muted = false;
  const R = Math.random;
  function init() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
      nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1;
      ambient();
    } catch (e) { ac = null; }
  }
  function noise(dur, f, q, g, type, f2) {
    if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type || "lowpass"; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;

  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(hdx + 3.6, hdy - 0.8, 1.7, 0, 7); ctx.fill(); ctx.fillStyle = "#050506";
  ctx.lineWidth = 6; limb(hx, hy, hx + l1.kx, hy + l1.ky, hx + l1.fx, hy + l1.fy);   // ön bacak
